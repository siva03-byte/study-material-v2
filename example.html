<!DOCTYPE html>
<html>
<head>
<title>Study Material System</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Navbar -->
<div class="navbar">
    <div class="logo">Study Material System</div>
    <div class="menu">
        <a href="#">Home</a>
        <a href="#">Browse</a>
        <a href="#">Login</a>
        <a href="#">Register</a>
    </div>
</div>

<!-- Main Section -->
<div class="hero">

    <div class="search-box">
        <input type="text" placeholder="Search notes, collections, and more...">
        <button>Search</button>
    </div>

    <h1>Share Knowledge, <span>Learn Together</span></h1>

    <p>
        Join thousands of students and educators sharing notes, documents,
        and study materials. Build your digital library and discover
        valuable resources from around the world.
    </p>

    <div class="buttons">
        <button class="start">Get Started</button>
        <button class="login">Sign In</button>
    </div>

    <div class="icon">
        📖
    </div>

    <!-- Stats -->
    <div class="stats">
        <div class="card">
            <h2>1250</h2>
            <p>Notes</p>
        </div>

        <div class="card">
            <h2>850</h2>
            <p>Users</p>
        </div>

        <div class="card">
            <h2>5600</h2>
            <p>Downloads</p>
        </div>
    </div>

</div>

</body>
</html>
